name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not e2e"
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Install Lightpanda (nightly)
        run: |
          curl -sL -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x lightpanda && ./lightpanda version
      - run: pytest -q -m e2e
        env:
          RSICRAWL_LIGHTPANDA: ${{ github.workspace }}/lightpanda
          LIGHTPANDA_DISABLE_TELEMETRY: "true"
