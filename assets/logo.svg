<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">RSICrawl logo</title>
  <desc id="d">An angular spider-robot with a glowing visor, inside a neon self-improvement ring.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#16213A"/>
      <stop offset="1" stop-color="#070B16"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3552"/>
      <stop offset="1" stop-color="#121A2E"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <!-- faint web / circuit grid -->
  <g stroke="#2B3A63" stroke-width="1.5" fill="none" opacity="0.7">
    <circle cx="256" cy="262" r="70"/><circle cx="256" cy="262" r="120"/><circle cx="256" cy="262" r="170"/>
    <path d="M256 92 V432 M86 262 H426 M136 142 L376 382 M376 142 L136 382"/>
  </g>

  <!-- recursive ring: three arcs, each chasing the next (iterate -> learn -> improve) -->
  <defs>
    <marker id="hA" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF2BD6"/></marker>
    <marker id="hB" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7B5CFF"/></marker>
    <marker id="hC" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00F0FF"/></marker>
    <linearGradient id="arcA" x1="256" y1="44" x2="430" y2="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
    <linearGradient id="arcB" x1="440" y1="330" x2="80" y2="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF2BD6"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient>
    <linearGradient id="arcC" x1="70" y1="330" x2="200" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#00F0FF"/></linearGradient>
  </defs>
  <g fill="none" stroke-width="14" stroke-linecap="round" filter="url(#glow)">
    <path d="M 270 44.5 A 212 212 0 0 1 444 160" stroke="url(#arcA)" marker-end="url(#hA)"/>
    <path d="M 456 330 A 212 212 0 0 1 80 382" stroke="url(#arcB)" marker-end="url(#hB)"/>
    <path d="M 56 330 A 212 212 0 0 1 200 52" stroke="url(#arcC)" marker-end="url(#hC)"/>
  </g>

  <!-- legs: sharp segmented, neon joints -->
  <g stroke="#9FB3E0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="214,242 150,196 118,214 96,262"/>
    <polyline points="206,270 136,252 104,292 98,330"/>
    <polyline points="210,298 146,316 128,360 140,392"/>
    <polyline points="226,320 186,366 190,410 210,432"/>
    <polyline points="298,242 362,196 394,214 416,262"/>
    <polyline points="306,270 376,252 408,292 414,330"/>
    <polyline points="302,298 366,316 384,360 372,392"/>
    <polyline points="286,320 326,366 322,410 302,432"/>
  </g>
  <g fill="#00F0FF" filter="url(#softglow)">
    <circle cx="150" cy="196" r="6"/><circle cx="136" cy="252" r="6"/><circle cx="146" cy="316" r="6"/><circle cx="186" cy="366" r="6"/>
  </g>
  <g fill="#FF2BD6" filter="url(#softglow)">
    <circle cx="362" cy="196" r="6"/><circle cx="376" cy="252" r="6"/><circle cx="366" cy="316" r="6"/><circle cx="326" cy="366" r="6"/>
  </g>

  <!-- abdomen (rear) -->
  <path d="M256 300 L306 330 L296 392 L256 414 L216 392 L206 330 Z" fill="url(#armor)" stroke="url(#neon)" stroke-width="4"/>
  <path d="M256 322 L278 336 L274 372 L256 384 L238 372 L234 336 Z" fill="none" stroke="#7B5CFF" stroke-width="3" opacity="0.9"/>

  <!-- head / thorax: angular armored hexagon -->
  <path d="M256 168 L320 204 L326 266 L256 312 L186 266 L192 204 Z" fill="url(#armor)" stroke="url(#neon)" stroke-width="5"/>
  <path d="M256 168 L256 196 M192 204 L214 214 M320 204 L298 214" stroke="#3E4C74" stroke-width="3"/>

  <!-- glowing visor -->
  <path d="M206 236 L306 236 L296 262 L216 262 Z" fill="url(#visor)" filter="url(#glow)"/>
  <rect x="226" y="244" width="22" height="8" rx="2" fill="#FFFFFF" opacity="0.9"/>
  <rect x="264" y="244" width="22" height="8" rx="2" fill="#FFFFFF" opacity="0.9"/>

  <!-- antenna sensor -->
  <path d="M256 168 L256 138" stroke="#9FB3E0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="132" r="8" fill="#00F0FF" filter="url(#glow)"/>
</svg>
