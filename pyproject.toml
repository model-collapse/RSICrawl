[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsicrawl"
version = "0.1.0"
description = "A self-improving web crawler: an LLM agent learns direct data paths, cross-site playbooks and its own analyzer skills, under a judge it cannot change."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.84",
  "aiohttp>=3.9",
  "httpx>=0.27",
  "websockets>=12",
  "beautifulsoup4>=4.12",
  "lxml>=5",
]
[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["rsicrawl", "siteforge", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests that need the Lightpanda binary (deselect with -m 'not e2e')"]
